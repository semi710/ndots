name: check

on:
  push:
    branches: [master]
    paths:
      - hosts/**
      - modules/**
      - overlays/**
      - packages/**
      - parts/**
      - flake.nix
      - flake.lock
      - justfile
  workflow_dispatch:

# Cancel in-progress runs on new pushes; stale evals waste runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # eval, not build: every deploy target's drvPath must resolve.
      # cheap (minutes), catches config drift before deploy. the iso
      # workflow owns its own build + release.
      - name: Check all deploy targets evaluate
        run: just check
