name: cache

on:
  push:
    branches: [master]
    paths:
      - packages/**
      - overlays/**
      - modules/**
      - hosts/**
      - flake.nix
      - flake.lock
  workflow_dispatch:

# Cancel in-progress runs on new pushes; stale builds waste runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-cache:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org https://nvix.cachix.org https://nija.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nvix.cachix.org-1:qVYAfj2oiH0DF3pSs8OfPYI6B0mAZ+h5mMajN+EOL2E= nija.cachix.org-1:wJRNRxBn1M1SAgzVv5ZAMe07ky6bkSSznMH0tEOFdcA=

      - uses: cachix/cachix-action@v15
        with:
          name: nija
          authToken: ${{ secrets.NIJA_CACHIX_TOKEN }}

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          df -h

      # The home configurations and host toplevels carry the expensive
      # closures (nvix full with its grammar set, the ocv opencode build,
      # workmux); caching them is what turns local deploys into downloads.
      - name: Build devshell, packages, home configs and host toplevels
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          # packages this system supports (iso has its own workflow)
          PACKAGES=$(nix eval --impure --raw --apply \
            'p: builtins.concatStringsSep " " (
              builtins.map (n: ".#" + n) (
                builtins.filter (n:
                  n != "iso" && (
                    let pkg = p.${n}; sys = builtins.currentSystem; in
                    (pkg.meta.platforms or [ ]) == [ ]
                    || (builtins.elem sys (pkg.meta.platforms or [ ])
                        && !builtins.elem sys (pkg.meta.badPlatforms or [ ]))
                  )
                ) (builtins.attrNames p)
              )
            )' \
            .#packages.$SYSTEM)

          # every home configuration user on this system
          HOMES=$(nix eval --impure --json --expr "
            builtins.attrNames
              (builtins.getFlake (toString ./.)).legacyPackages.$SYSTEM.homeConfigurations" \
            | jq -r '.[] | ".#legacyPackages." + env.SYSTEM + ".homeConfigurations." + . + ".activationPackage"')

          # every nixos host whose platform is this system (hosts without a
          # platform, like the 'anywhere' installer config, are skipped)
          HOSTS=$(nix eval --impure --json --expr "
            let
              flake = builtins.getFlake (toString ./.);
              cfgs = flake.nixosConfigurations;
              sys = builtins.getEnv \"SYSTEM\";
            in builtins.filter
              (n: (builtins.tryEval cfgs.\${n}.pkgs.stdenv.hostPlatform.system).value or \"\" == sys)
              (builtins.attrNames cfgs)" \
            | jq -r '.[] | ".#nixosConfigurations." + . + ".config.system.build.toplevel"')

          # darwin system toplevels only build on the darwin runner
          DARWIN=""
          if [ "$SYSTEM" = "aarch64-darwin" ]; then
            DARWIN=$(nix eval --impure --json --expr \
              'builtins.attrNames (builtins.getFlake (toString ./.)).darwinConfigurations' \
              | jq -r '.[] | ".#darwinConfigurations." + . + ".config.system.build.toplevel"')
          fi

          echo "packages: $PACKAGES"
          echo "homes:    $HOMES"
          echo "hosts:    $HOSTS"
          echo "darwin:   $DARWIN"

          nix build --no-link --print-out-paths \
            .#devShells.$SYSTEM.default \
            $PACKAGES $HOMES $HOSTS $DARWIN
